<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Invitation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>
<body>
    <div id="sign-section">
        <h2 id="authName">Loading...</h2>
        <p>Please sign below:</p>
        <canvas id="signature-pad" width="300" height="150"></canvas><br>
        <button onclick="signaturePad.clear()">Clear</button>
        <button onclick="submitSignature()">Submit</button>
    </div>

    <div id="poster-section" class="hidden poster">
        <h3>TECH EVENT 2026</h3>
        <p>We proudly invite</p>
        <h4 id="poster-name"></h4>
        <img id="poster-sig" src="" width="150" alt="Signature">
        <p>Guest of Honour<br>Venue: Auditorium<br>Date: 15 May 2026</p>
    </div>

    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
